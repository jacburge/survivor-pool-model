[project]
name = "survivor"
version = "0.1.0"
description = "NFL Survivor Pool decision pipeline"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.1",
    "requests>=2.31",
    "python-dotenv>=1.0",
    "beautifulsoup4>=4.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["survivor*"]
